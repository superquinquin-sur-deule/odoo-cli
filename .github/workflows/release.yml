name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag.outputs.new_version }}
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

  build:
    needs: tag
    if: needs.tag.outputs.new_version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x86_64
          - os: macos-14
            asset_suffix: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Mandrel (GraalVM for Quarkus) + Maven cache
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'mandrel'
          java-version: '21'
          version: 'mandrel-latest'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run JVM tests
        run: mvn -B test

      - name: Align pom.xml version with release version
        run: mvn -B versions:set -DnewVersion=${{ needs.tag.outputs.new_version }} -DgenerateBackupPoms=false

      - name: Build native binary
        run: mvn -B package -Dnative -DskipTests

      - name: Rename binary asset
        run: mv target/odoo-cli-${{ needs.tag.outputs.new_version }}-runner odoo-cli-${{ needs.tag.outputs.new_version }}-${{ matrix.asset_suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: odoo-cli-${{ matrix.asset_suffix }}
          path: odoo-cli-${{ needs.tag.outputs.new_version }}-${{ matrix.asset_suffix }}
          if-no-files-found: error

  release:
    needs: [tag, build]
    if: needs.tag.outputs.new_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.new_tag }}
          name: ${{ needs.tag.outputs.new_tag }}
          body: ${{ needs.tag.outputs.changelog }}
          files: artifacts/*
