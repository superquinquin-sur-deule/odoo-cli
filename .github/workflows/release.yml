name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version from conventional commits
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Set up Mandrel (GraalVM for Quarkus) + Maven cache
        if: steps.tag.outputs.new_version != ''
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'mandrel'
          java-version: '21'
          version: 'mandrel-latest'
          cache: 'maven'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align pom.xml version with release version
        if: steps.tag.outputs.new_version != ''
        run: mvn -B versions:set -DnewVersion=${{ steps.tag.outputs.new_version }} -DgenerateBackupPoms=false

      - name: Run JVM tests
        if: steps.tag.outputs.new_version != ''
        run: mvn -B test

      - name: Build native binary
        if: steps.tag.outputs.new_version != ''
        run: mvn -B package -Dnative -DskipTests

      - name: Rename binary asset
        if: steps.tag.outputs.new_version != ''
        run: mv target/odoo-cli-${{ steps.tag.outputs.new_version }}-runner odoo-cli-${{ steps.tag.outputs.new_version }}-linux-x86_64

      - name: Create GitHub Release
        if: steps.tag.outputs.new_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: odoo-cli-${{ steps.tag.outputs.new_version }}-linux-x86_64
